# Direct Preference Optimization (DPO) Hyperparameters
model:
  sft_model_checkpoint: "checkpoints/sft_output"
  base_model_name: "Qwen/Qwen2.5-1.5B-Instruct"

dpo:
  beta: 0.1 # Implicit reward temperature parameter
  loss_type: "sigmoid" # Standard DPO loss
  max_length: 2048
  max_prompt_length: 1024
  max_target_length: 1024

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"

training:
  output_dir: "checkpoints/dpo_output"
  num_train_epochs: 2
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-6
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  bf16: true
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 50
  save_strategy: "steps"
  save_steps: 50
  save_total_limit: 2
