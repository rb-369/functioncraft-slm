[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "functioncraft-slm"
version = "0.1.0"
description = "Production-grade SLM distillation, SFT + DPO alignment, and low-latency serving engine for structured outputs and tool calling."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "ML Engineer", email = "engineer@example.com" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "jsonschema>=4.21.0",
    "requests>=2.31.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    "streamlit>=1.35.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.2.0",
    "transformers>=4.41.0",
    "datasets>=2.19.0",
    "trl>=0.8.6",
    "peft>=0.11.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.30.0"
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
